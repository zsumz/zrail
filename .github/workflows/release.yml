name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

# Repository rules must protect v* tags. The release environment must require
# review and permit deployments only from those protected tags. Each published
# crate must trust this workflow and the release environment on crates.io.
jobs:
  qualify:
    name: qualify protected tag
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version tag reachable from the protected branch
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          version="${tag#v}"
          manifest_version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          test "$version" = "$manifest_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-rust

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Run complete qualification gate offline
        run: scripts/check

  build:
    name: build ${{ matrix.target }}
    needs: qualify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            archive: tar.gz
            python: python3
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
            python: python3
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            archive: tar.gz
            python: python3
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: tar.gz
            python: python3
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.gz
            python: python3
          - target: aarch64-apple-darwin
            runner: macos-15
            archive: tar.gz
            python: python3
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            archive: zip
            python: python
    env:
      ZRAIL_TARGET: ${{ matrix.target }}
      ZRAIL_VERSION: ${{ needs.qualify.outputs.version }}
    steps:
      - name: Check out qualified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-rust

      - name: Add release target
        run: rustup target add "$ZRAIL_TARGET"

      - name: Install musl linker
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          target_key="$(printf '%s' "$ZRAIL_TARGET" | tr '[:lower:]-' '[:upper:]_')"
          echo "CARGO_TARGET_${target_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build locked release binary offline
        run: >-
          cargo build --release --locked --offline
          -p zrail --bin zrail --target "$ZRAIL_TARGET"

      - name: Verify produced binary and smoke check
        run: |
          binary="target/$ZRAIL_TARGET/release/zrail"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          test "$("$binary" --version)" = "zrail $ZRAIL_VERSION"
          "$binary" check --root "$GITHUB_WORKSPACE"

      - name: Package deterministic archive
        run: |
          binary="target/$ZRAIL_TARGET/release/zrail"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          archive="dist/zrail-$ZRAIL_VERSION-$ZRAIL_TARGET.${{ matrix.archive }}"
          "${{ matrix.python }}" scripts/package-release.py \
            --binary "$binary" --license LICENSE --readme README.md --output "$archive"

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/zrail-${{ env.ZRAIL_VERSION }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0

  package:
    name: package publishable crates
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out qualified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-rust

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Package and verify publishable crates offline
        run: scripts/package-check

      - name: Stage exact crate archives
        env:
          ZRAIL_VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          mkdir -p dist
          cp "target/package/zrail-core-$ZRAIL_VERSION.crate" dist/
          cp "target/package/zrail-rust-$ZRAIL_VERSION.crate" dist/
          cp "target/package/zrail-$ZRAIL_VERSION.crate" dist/

      - name: Upload immutable crate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-crates
          path: dist/*.crate
          if-no-files-found: error
          compression-level: 0

  linux-runtime:
    name: clean runtime ${{ matrix.target }}
    needs: [qualify, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: ubuntu:24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            image: alpine:3.22
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.22
    steps:
      - name: Download Linux archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ matrix.target }}
          path: archive

      - name: Run without a Rust toolchain in a clean container
        env:
          ZRAIL_VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          mkdir -p runtime smoke/src
          tar -xzf "archive/zrail-$ZRAIL_VERSION-${{ matrix.target }}.tar.gz" -C runtime
          printf '[package]\nname = "smoke"\nversion = "0.0.0"\nedition = "2024"\n' > smoke/Cargo.toml
          printf 'fn main() {}\n' > smoke/src/main.rs
          docker run --rm \
            --volume "$PWD/runtime:/release:ro" \
            --volume "$PWD/smoke:/work" \
            "${{ matrix.image }}" sh -c \
            '/release/zrail --version && /release/zrail init --preset rust /work && /release/zrail check --root /work'

  publish:
    name: attest and publish
    needs: [qualify, build, package, linux-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      ZRAIL_VERSION: ${{ needs.qualify.outputs.version }}
    steps:
      - name: Check out reviewed release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up the same pinned publish Rust
        uses: ./.github/actions/setup-rust

      - name: Download every qualified archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Require the exact release set and generate checksums
        run: |
          expected=(
            "zrail-$ZRAIL_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "zrail-$ZRAIL_VERSION-aarch64-unknown-linux-gnu.tar.gz"
            "zrail-$ZRAIL_VERSION-x86_64-unknown-linux-musl.tar.gz"
            "zrail-$ZRAIL_VERSION-aarch64-unknown-linux-musl.tar.gz"
            "zrail-$ZRAIL_VERSION-x86_64-apple-darwin.tar.gz"
            "zrail-$ZRAIL_VERSION-aarch64-apple-darwin.tar.gz"
            "zrail-$ZRAIL_VERSION-x86_64-pc-windows-msvc.zip"
            "zrail-core-$ZRAIL_VERSION.crate"
            "zrail-rust-$ZRAIL_VERSION.crate"
            "zrail-$ZRAIL_VERSION.crate"
          )
          test "$(find dist -maxdepth 1 -type f -name 'zrail-*' | wc -l | tr -d ' ')" = 10
          for archive in "${expected[@]}"; do test -f "dist/$archive"; done
          (cd dist && sha256sum "${expected[@]}" > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Extract reviewed release notes
        run: >-
          python3 scripts/release-notes.py
          "$ZRAIL_VERSION" CHANGELOG.md "$RUNNER_TEMP/release-notes.md"

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/zrail-*.tar.gz
            dist/zrail-*.zip
            dist/zrail-*.crate
            dist/SHA256SUMS

      - name: Prove publish mode reproduces every attested crate
        run: scripts/publish-crates --preflight

      - name: Create or reuse the exact draft release
        run: |
          expected_assets=(
            "zrail-$ZRAIL_VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "zrail-$ZRAIL_VERSION-aarch64-unknown-linux-gnu.tar.gz"
            "zrail-$ZRAIL_VERSION-x86_64-unknown-linux-musl.tar.gz"
            "zrail-$ZRAIL_VERSION-aarch64-unknown-linux-musl.tar.gz"
            "zrail-$ZRAIL_VERSION-x86_64-apple-darwin.tar.gz"
            "zrail-$ZRAIL_VERSION-aarch64-apple-darwin.tar.gz"
            "zrail-$ZRAIL_VERSION-x86_64-pc-windows-msvc.zip"
            "zrail-core-$ZRAIL_VERSION.crate"
            "zrail-rust-$ZRAIL_VERSION.crate"
            "zrail-$ZRAIL_VERSION.crate"
            SHA256SUMS
          )
          release_json="$RUNNER_TEMP/release.json"
          release_api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
          fetch_release() {
            release_status="$(curl --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$release_json" --write-out '%{http_code}' "$release_api")"
          }

          fetch_release
          case "$release_status" in
            404)
              gh release create "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
                --target "$GITHUB_SHA" --title "zrail $ZRAIL_VERSION" \
                --notes-file "$RUNNER_TEMP/release-notes.md"
              fetch_release
              test "$release_status" = 200
              ;;
            200)
              echo "Reusing existing release draft for $GITHUB_REF_NAME"
              ;;
            *)
              echo "GitHub returned HTTP $release_status while checking the release" >&2
              exit 1
              ;;
          esac

          if ! jq -e --arg tag "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            --arg title "zrail $ZRAIL_VERSION" '
            .tag_name == $tag and .draft == true and
            .prerelease == false and .name == $title and
            .target_commitish == $sha and (.assets | type == "array")
          ' "$release_json" >/dev/null; then
            echo "existing release is not the exact draft for the reviewed commit" >&2
            exit 1
          fi

          mapfile -t existing_assets < <(jq -r '.assets[].name' "$release_json")
          for asset in "${existing_assets[@]}"; do
            expected=false
            for candidate in "${expected_assets[@]}"; do
              if [[ "$asset" == "$candidate" ]]; then expected=true; break; fi
            done
            if [[ "$expected" != true ]]; then
              echo "existing draft contains unexpected asset: $asset" >&2
              exit 1
            fi
          done

          existing_dir="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$existing_dir"
          for expected in "${expected_assets[@]}"; do
            present=false
            for asset in "${existing_assets[@]}"; do
              if [[ "$asset" == "$expected" ]]; then present=true; break; fi
            done
            if [[ "$present" == true ]]; then
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --pattern "$expected" --dir "$existing_dir"
              cmp "dist/$expected" "$existing_dir/$expected"
            else
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                "dist/$expected"
            fi
          done

          fetch_release
          test "$release_status" = 200
          printf '%s\n' "${expected_assets[@]}" | sort > "$RUNNER_TEMP/expected-assets"
          jq -r '.assets[].name' "$release_json" | sort > "$RUNNER_TEMP/actual-assets"
          cmp "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"

      - name: Authenticate with crates.io trusted publishing
        id: crates_io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish and verify exact registry archives
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io.outputs.token }}
        run: scripts/publish-crates --publish

      - name: Publish GitHub release after registry success
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
