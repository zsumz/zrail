name: Architecture authority

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: architecture-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  review:
    name: protected source review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZRAIL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ZRAIL_PROPOSAL_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ZRAIL_BASE_SHA }}
          persist-credentials: false

      - name: Mark proposal review pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$ZRAIL_PROPOSAL_SHA"
          -f state=pending
          -f context=zrail/protected-source-review
          -f description='Protected zrail review is running'
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Isolate trusted Cargo state
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/zrail-cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/zrail-authority-target" >> "$GITHUB_ENV"

      - name: Set up trusted Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Build trusted authority outside the proposal tree
        run: |
          env -u RUSTC -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER \
            -u CARGO_BUILD_RUSTC -u CARGO_BUILD_RUSTC_WRAPPER \
            -u CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER \
            cargo fetch --locked
          env -u RUSTC -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER \
            -u CARGO_BUILD_RUSTC -u CARGO_BUILD_RUSTC_WRAPPER \
            -u CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER \
            cargo build --locked --offline -p zrail

      - name: Check out proposal as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ env.ZRAIL_PROPOSAL_SHA }}
          path: proposal
          persist-credentials: false

      - name: Independently review observed proposal state
        id: review
        continue-on-error: true
        run: >-
          "$CARGO_TARGET_DIR/debug/zrail" review
          --authority-root "$GITHUB_WORKSPACE"
          --base "$ZRAIL_BASE_SHA"
          --root "$GITHUB_WORKSPACE/proposal"
          --deny-grants

      - name: Publish proposal review result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ZRAIL_REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [[ "$ZRAIL_REVIEW_OUTCOME" == "success" ]]; then
            state=success
            description='Protected zrail review passed'
          else
            state=failure
            description='Protected zrail review failed'
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$ZRAIL_PROPOSAL_SHA" \
            -f state="$state" \
            -f context=zrail/protected-source-review \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Enforce proposal review result
        if: steps.review.outcome != 'success'
        run: exit 1
