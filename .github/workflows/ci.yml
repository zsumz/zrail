name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  canonical:
    name: canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Run canonical gate offline
        run: scripts/check

  portable:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Compile and test portable behavior
        run: cargo test --workspace --locked

  compatibility:
    name: compatibility (Rust 1.96.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reject repository-local Cargo configuration
        run: |
          for cargo_config in .cargo/config .cargo/config.toml; do
            if [[ -e "$cargo_config" || -L "$cargo_config" ]]; then
              echo "repository-local Cargo configuration is not permitted: $cargo_config" >&2
              exit 1
            fi
          done

      - name: Set up Rust 1.96 compatibility toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.96.1"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Compile all supported targets and features
        run: cargo check --workspace --all-targets --all-features --locked
