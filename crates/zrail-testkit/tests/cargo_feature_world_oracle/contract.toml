schema = 2
adapters = ["rust"]

[repository]
roots = ["."]
exclude = []
workspace_members = "exact"
nested_git = "deny"
submodules = "deny"
symlinks = "inside"

[dependencies]
mode = "observed"
unassigned_packages = "allow"
cycles = "deny"

[source.rust]
module_docs = "required"
facades = "allow"
entrypoints = "allow"
tests = "allow"

[source.rust.hygiene]
unsafe = "deny"
lint_suppressions = "deny"

[[source.rust.feature_worlds]]
name = "default"
reason = "Trusted Cargo feature oracle."

[[source.rust.feature_worlds.packages]]
package = "oracle-app"
default_features = false
features = []
