schema = 1
adapters = ["rust"]

[repository]
roots = ["crates"]
exclude = []
workspace_members = "exact"
nested_git = "deny"
submodules = "deny"
symlinks = "inside"

[dependencies]
mode = "observed"
unassigned_packages = "deny"
cycles = "deny"

[source.rust]
module_docs = "required"
facades = "declarative"
tests = "sibling"

[source.rust.hygiene]
unsafe = "deny"
lint_suppressions = "deny"
deny_methods = ["unwrap", "expect"]
deny_macros = ["panic", "todo", "unimplemented", "unreachable", "dbg"]

[source.rust.size.facade]
target = 80
hard = 120

[source.rust.size.implementation]
target = 240
hard = 300

[source.rust.size.test]
target = 300
hard = 400

[source.rust.size.auxiliary]
target = 300
hard = 300

[[layer]]
name = "core"
packages = ["fixture-core"]
may_depend_on = []
reason = "core must remain below the manager"

[[layer]]
name = "manager"
packages = ["fixture-manager"]
may_depend_on = ["core"]
reason = "manager may depend inward"
