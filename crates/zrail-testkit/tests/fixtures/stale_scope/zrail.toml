schema = 1
adapters = ["rust"]

[repository]
roots = ["crates"]
exclude = []
workspace_members = "exact"
nested_git = "deny"
submodules = "deny"
symlinks = "inside"

[dependencies]
mode = "observed"
unassigned_packages = "allow"
cycles = "deny"

[source.rust]
module_docs = "required"
facades = "declarative"
tests = "sibling"

[source.rust.hygiene]
unsafe = "deny"
lint_suppressions = "deny"
deny_methods = ["unwrap", "expect"]
deny_macros = ["panic", "todo", "unimplemented", "unreachable", "dbg"]

[source.rust.size.facade]
target = 80
hard = 120

[source.rust.size.implementation]
target = 240
hard = 300

[source.rust.size.test]
target = 300
hard = 400

[source.rust.size.auxiliary]
target = 300
hard = 300

[[scope]]
name = "missing-source"
include = ["crates/missing/src/**"]
reason = "a stale source scope must be loud"

[scope.symbols]
deny = ["std::net"]

[[owner]]
name = "stale-filesystem-owner"
kind = "capability"
within = ["crates/fixture/src/**"]
match = "std::fs"
allow = ["crates/fixture/src/worker.rs"]
reason = "An ownership rule with no capability use is stale policy."
