schema = 1
adapters = ["rust"]

[repository]
roots = ["crates"]
exclude = ["crates/zrail-testkit/tests/fixtures/**"]
workspace_members = "exact"
nested_git = "deny"
submodules = "deny"
symlinks = "inside"

[[gate]]
name = "check"
kind = "local"
path = "scripts/check"
inputs = ["scripts/structure-check", "scripts/package-check", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml", ".gitignore", "Cargo.toml", "crates/zrail-cli/Cargo.toml", "crates/zrail-core/Cargo.toml", "crates/zrail-rust/Cargo.toml", "crates/zrail-testkit/Cargo.toml"]
reason = "The repository's canonical local qualification entrypoint."

[[gate]]
name = "ci"
kind = "ci"
path = ".github/workflows/ci.yml"
inputs = [".github/actions/setup-rust/action.yml"]
requires = ["check"]
reason = "Hosted qualification runs the canonical gate and portable workspace tests."

[[gate]]
name = "architecture-review"
kind = "ci"
path = ".github/workflows/authority.yml"
inputs = [".github/actions/setup-rust/action.yml"]
requires = ["check"]
reason = "The repository demonstrates protected-base analysis without claiming proposal-owned Actions as merge authority."

[[gate]]
name = "security"
kind = "ci"
path = ".github/workflows/security.yml"
inputs = [".github/actions/setup-rust/action.yml"]
requires = ["check"]
reason = "Online RustSec advisory checks complement the complete offline qualification gate."

