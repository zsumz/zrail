  "rust-test:crates/zrail-testkit/tests/qualification_workflows.rs::local_gate_rejects_cargo_configuration_before_cargo_commands",
  "rust-test:crates/zrail-testkit/tests/qualification_gate_inputs.rs::repository_manifests_are_locked_qualification_inputs",
